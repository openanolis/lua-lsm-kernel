name: Lua-LSM CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  functional:
    name: functional matrix
    # Pin the runner: ubuntu-latest migrates to 26.04 in Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WS: ${{ github.workspace }}/ws
    steps:
      - name: Checkout kernel (PR merge)
        uses: actions/checkout@v4
        with:
          path: ws/kernel/linux

      - name: Checkout test harness
        uses: actions/checkout@v4
        with:
          repository: chenzongyao200127/lua-lsm-testsuite
          ref: main
          path: ws/lua-lsm-testsuite

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 openssh-client debootstrap e2fsprogs \
            flex bison libelf-dev libssl-dev bc cpio

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on runner; functional matrix requires KVM"
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Build kernel
        run: |
          cd "$WS/kernel/linux"
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config .github/ci/kernel.config
          make olddefconfig
          grep -E "CONFIG_SECURITY_LUA_LSM=|CONFIG_MODULES=|CONFIG_9P_FS=" .config
          make -j"$(nproc)" bzImage

      - name: Build minimal rootfs
        run: |
          ssh-keygen -t rsa -b 2048 -f "$WS/ci_key" -N "" -q
          sudo SSH_PUBKEY="$WS/ci_key.pub" OUTPUT="$WS/rootfs.img" \
            bash "$WS/lua-lsm-testsuite/tools/create_ci_rootfs.sh"
          sudo chown "$USER" "$WS/rootfs.img"

      - name: Run functional matrix
        run: |
          cd "$WS/lua-lsm-testsuite"
          uv sync --dev
          export MEM_SIZE=4G SMP_COUNT=2
          uv run python -m harness matrix \
            --config configs/functional.yaml \
            --parallel 1 \
            --kernel "$WS/kernel/linux/arch/x86/boot/bzImage" \
            --rootfs "$WS/rootfs.img" \
            --share-dir "$WS" \
            --ssh-key "$WS/ci_key" \
            --junit "$WS/junit.xml"

      - name: Summarize results
        if: always()
        run: |
          find "$WS/lua-lsm-testsuite/runs" -name matrix.json | while read -r f; do
            echo "== $f"; cat "$f"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lua-lsm-functional-runs
          path: |
            ws/lua-lsm-testsuite/runs
            ws/junit.xml
          if-no-files-found: warn